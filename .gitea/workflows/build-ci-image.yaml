name: Build CI Worker Image

on:
  workflow_dispatch:

  push:
    paths:
      - infrastructure/images/ci-runner/**


jobs:

  build:

    name: Build CI Worker

    runs-on: ubuntu-latest


    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Docker Info
        run: |
          docker version
          docker info


      - name: Build CI Worker Image
        run: |
          docker build \
            --no-cache \
            -t aiassistant-ci:test \
            infrastructure/images/ci-runner


      - name: Test CI Worker Image
        run: |
          docker run --rm aiassistant-ci:test sh -c "
            python --version &&
            uv --version &&
            jq --version &&
            yq --version
          "

      - name: Resolve Registry Configuration
        run: |
          RESPONSE=$(curl -sf http://infra_configuration_manager:8080/contracts/registry) || {
            echo "ERROR: Could not reach configuration manager service"
            exit 1
          }
          STATUS=$(echo "$RESPONSE" | jq -r '.status')
          if [ "$STATUS" != "validated" ]; then
            echo "Registry contract validation failed"
            echo "$RESPONSE" | jq '.errors // .detail // .'
            exit 1
          fi
          echo "$RESPONSE" | jq -r '.configuration | to_entries[] | "\(.key)=\(.value)"' >> $GITHUB_ENV

      - name: Login to Local Registry
        run: |
          docker login registry.local.test \
            --username "$REGISTRY_USER" \
            --password "$REGISTRY_PASSWORD"

      - name: Tag CI Worker Image
        run: |
          docker tag \
            aiassistant-ci:test \
            aiassistant-ci:latest
          docker tag \
            aiassistant-ci:test \
            registry.local.test/aiassistant/ci-runner:latest


      - name: Push CI Worker Image
        run: |
          docker push \
            registry.local.test/aiassistant/ci-runner:latest

      - name: Complete
        run: |
          echo "CI worker image build successful"