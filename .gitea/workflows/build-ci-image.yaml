name: Build CI Worker Image

on:
  workflow_dispatch:

  push:
    paths:
      - infrastructure/images/ci-runner/**
      - packages/configuration/**


jobs:

  build:

    name: Build CI Worker and Configuration Manager

    runs-on: ubuntu-latest

    env:
      REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Docker Info
        run: |
          docker version
          docker info


      - name: Validate Required Secrets
        run: |
          if [ -z "$REGISTRY_USER" ] || [ -z "$REGISTRY_PASSWORD" ]; then
            echo "ERROR: REGISTRY_USER and REGISTRY_PASSWORD secrets must be set"
            exit 1
          fi
          echo "Registry credentials validated from secrets"


      - name: Build Configuration Manager Image
        run: |
          docker build \
            -t platform/configuration-manager:test \
            packages/configuration


      - name: Build CI Worker Image
        run: |
          docker build \
            -t aiassistant-ci:test \
            infrastructure/images/ci-runner


      - name: Test CI Worker Image
        run: |
          docker run --rm aiassistant-ci:test sh -c "
            python --version &&
            uv --version &&
            jq --version &&
            yq --version
          "


      - name: Test Configuration Manager Image
        run: |
          docker run --rm platform/configuration-manager:test sh -c "
            python --version &&
            pip --version
          "


      - name: Login to Local Registry
        run: |
          echo "$REGISTRY_PASSWORD" | \
          docker login registry.local.test \
            --username "$REGISTRY_USER" \
            --password-stdin


      - name: Tag CI Worker Image
        run: |
          docker tag \
            aiassistant-ci:test \
            registry.local.test/aiassistant/ci-runner:0.1.0


      - name: Tag Configuration Manager Image
        run: |
          docker tag \
            platform/configuration-manager:test \
            registry.local.test/aiassistant/configuration-manager:0.1.0


      - name: Push CI Worker Image
        run: |
          docker push \
            registry.local.test/aiassistant/ci-runner:0.1.0


      - name: Push Configuration Manager Image
        run: |
          docker push \
            registry.local.test/aiassistant/configuration-manager:0.1.0


      - name: Complete
        run: |
          echo "CI worker and configuration-manager images built and pushed successfully"