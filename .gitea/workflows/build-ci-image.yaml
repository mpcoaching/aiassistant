name: Build CI Worker Image

on:
  workflow_dispatch:

  push:
    paths:
      - infrastructure/images/ci-runner/**


jobs:

  build:

    name: Build CI Worker

    runs-on: ubuntu-latest


    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'


      - name: Install Configuration Package
        run: |
          pip install -e packages/configuration


      - name: Docker Info
        run: |
          docker version
          docker info


      - name: Build CI Worker Image
        run: |
          docker build \
            --no-cache \
            -t aiassistant-ci:test \
            infrastructure/images/ci-runner


      - name: Test CI Worker Image
        run: |
          docker run --rm aiassistant-ci:test sh -c "
            python --version &&
            uv --version &&
            jq --version &&
            yq --version
          "

      - name: Resolve Registry Configuration
        env:
          PYTHONPATH: packages/configuration/src
        run: |
          python3 - << 'PYEOF' > $GITHUB_ENV
          import sys
          import os
          from configuration.contracts.v1.registry import RegistryConfiguration
          from configuration.manager import ConfigurationManager
          from configuration.providers.env_file import DotEnvProvider
          from configuration.providers.registry import RegistryProvider
          
          if "REGISTRY_USER" not in os.environ or "REGISTRY_PASSWORD" not in os.environ:
            print("ERROR: REGISTRY_USER and REGISTRY_PASSWORD must be set", file=sys.stderr)
            sys.exit(1)
          
          manager = ConfigurationManager(DotEnvProvider(env_file=".env"))
          config = manager.resolve(RegistryConfiguration)
          
          provider = RegistryProvider(env_file=".env")
          result = provider.validate()
          
          if not result.success:
            print(f"ERROR: Registry validation failed: {result.error}", file=sys.stderr)
            sys.exit(1)
          
          print(f"export REGISTRY_USER={config.username}")
          print(f"export REGISTRY_PASSWORD={config.password}")
          print(f"export REGISTRY_ENDPOINT=registry.local.test")
          PYEOF

      - name: Login to Local Registry
        run: |
          docker login registry.local.test \
            --username "$REGISTRY_USER" \
            --password "$REGISTRY_PASSWORD"

      - name: Tag CI Worker Image
        run: |
          docker tag \
            aiassistant-ci:test \
            registry.local.test/aiassistant/ci-runner:0.1.0

      - name: Push CI Worker Image
        run: |
          docker push \
            registry.local.test/aiassistant/ci-runner:0.1.0

      - name: Complete
        run: |
          echo "CI worker image build successful"