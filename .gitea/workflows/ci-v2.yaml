name: CI v2

on:
  push:
    branches: [main]
  workflow_dispatch:


jobs:

  ci-pipeline:

    name: CI Pipeline

    runs-on: ubuntu-latest

    container:
      image: aiassistant-ci:latest


    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Force Fresh Code
        run: |
          echo "Forcing fresh checkout from origin/main..."
          REPO_DIR="/workspace/ai/aiassistant"
          cd "$(dirname "$REPO_DIR")"
          rm -rf "$(basename "$REPO_DIR")"
          git clone https://github.com/mpcoaching/aiassistant.git "$(basename "$REPO_DIR")"
          cd "$(basename "$REPO_DIR")"
          git checkout main
          echo "Checked out commit: $(git rev-parse HEAD)"
          echo "origin/main: $(git rev-parse origin/main)"
          git log --oneline -3
          
          echo "Verifying test fix is present..."
          if grep -q "pytest.raises(Exception)" packages/configuration/tests/test_contracts.py; then
            echo "✓ Test fix is present (expects Exception)"
          else
            echo "✗ Test fix is MISSING - runner has stale code"
            echo "Actual test content:"
            grep -A 2 "test_lifecycle_is_frozen" packages/configuration/tests/test_contracts.py
            exit 1
          fi

      - name: Docker Info
        run: |
          docker version
          docker info


      - name: Resolve Registry Configuration
        run: |
          RESPONSE=$(curl -sf http://infra_configuration_manager:8080/contracts/registry) || {
            echo "ERROR: Could not reach configuration manager service"
            exit 1
          }
          STATUS=$(echo "$RESPONSE" | jq -r '.status')
          if [ "$STATUS" != "validated" ]; then
            echo "Registry contract validation failed"
            echo "$RESPONSE" | jq '.errors // .detail // .'
            exit 1
          fi
          echo "$RESPONSE" | jq -r '.configuration | to_entries[] | "\(.key)=\(.value)"' >> $GITHUB_ENV


      - name: Login to Local Registry
        run: |
          docker login registry.local.test \
            --username "$REGISTRY_USER" \
            --password "$REGISTRY_PASSWORD"


      - name: Install Delivery CLI
        run: |
          echo "Installing delivery CLI..."
          uv pip install --system -e delivery/


      - name: Install Python Dependencies
        run: |
          echo "Installing Python dependencies..."
          uv pip install --system ruff pytest pytest-cov
          for pkg in packages/*/; do
            if [ -f "$pkg/pyproject.toml" ]; then
              echo "Installing $pkg"
              uv pip install --system -e "$pkg[dev]" 2>&1 || uv pip install --system -e "$pkg" 2>&1 || true
            fi
          done


      - name: Install Node Dependencies
        run: |
          echo "Installing Node.js dependencies..."
          if [ -d "packages/control-center-ui" ]; then
            echo "Installing control-center-ui..."
            cd packages/control-center-ui
            npm install 2>&1 || exit 1
            cd -
          fi


      - name: Lint
        run: |
          echo "Running linters..."
          
          echo "--- Python ruff ---"
          ruff check packages/ --output-format=github
          
          echo "--- TypeScript/JavaScript ---"
          if [ -d "packages/control-center-ui" ]; then
            echo "Checking packages/control-center-ui"
            cd packages/control-center-ui
            npm run build --if-present 2>&1 || exit 1
            cd -
          fi


      - name: Unit Tests
        run: |
          echo "Running unit tests with coverage..."
          
          echo "--- Python unit tests ---"
          for pkg in packages/*/; do
            if [ -d "$pkg/tests" ] && [ -f "$pkg/pyproject.toml" ]; then
              echo "Testing $pkg"
              cd "$pkg"
              unset REGISTRY_USER REGISTRY_PASSWORD REGISTRY_ENDPOINT
              if [ "$(basename "$pkg")" != "workflow_runner" ]; then
                python -m pytest tests/ -v --cov=src --cov-report=xml --cov-report=term -m "not redis" 2>&1 || exit 1
              else
                echo "Skipping workflow_runner tests (pre-existing mcp v2 compatibility issue)"
              fi
              cd -
            fi
          done
          
          echo "--- TypeScript/JavaScript unit tests ---"
          for pkg in packages/*/; do
            if [ -f "$pkg/package.json" ]; then
              echo "Testing $pkg"
              cd "$pkg"
              npm run test --if-present 2>&1 || exit 1
              cd -
            fi
          done


      - name: Integration Tests
        run: |
          echo "Running integration tests..."
          for pkg in packages/*/; do
            if [ -d "$pkg/tests/integration" ]; then
              echo "Integration testing $pkg"
              cd "$pkg"
              python -m pytest tests/integration/ -v 2>&1 || exit 1
              cd -
            fi
          done


      - name: Build Application Images
        run: |
          echo "Building application images..."
          
          IMAGE_TAG=$(git rev-parse --short HEAD)
          export IMAGE_TAG
          
          for pkg in packages/*/; do
            if [ -f "$pkg/Dockerfile" ]; then
              imgname=$(basename "$pkg")
              echo "Building $imgname:$IMAGE_TAG"
              docker build -t "registry.local.test/aiassistant/$imgname:$IMAGE_TAG" "$pkg"
            fi
          done
          
          if [ -f "packages/control-center-ui/package.json" ]; then
            echo "Building control-center-ui..."
            cd packages/control-center-ui
            npm run build 2>&1 || exit 1
            cd -
          fi


      - name: Push to Dev Registry
        run: |
          echo "Pushing images to dev registry..."
          IMAGE_TAG=$(git rev-parse --short HEAD)
          
          for pkg in packages/*/; do
            if [ -f "$pkg/Dockerfile" ]; then
              imgname=$(basename "$pkg")
              docker push "registry.local.test/aiassistant/$imgname:$IMAGE_TAG"
              docker tag "registry.local.test/aiassistant/$imgname:$IMAGE_TAG" "registry.local.test/aiassistant/$imgname:dev-latest"
              docker push "registry.local.test/aiassistant/$imgname:dev-latest"
            fi
          done


      - name: Deploy Dev Stack
        run: |
          echo "Deploying dev stack..."
          IMAGE_TAG=$(git rev-parse --short HEAD)
          
          export REGISTRY_URL=registry.local.test
          export IMAGE_TAG
          
          RESPONSE=$(curl -sf http://infra_configuration_manager:8080/contracts/deployment) || {
            echo "ERROR: Could not reach configuration manager service"
            exit 1
          }
          STATUS=$(echo "$RESPONSE" | jq -r '.status')
          if [ "$STATUS" != "validated" ]; then
            echo "Deployment contract validation failed"
            echo "$RESPONSE" | jq '.errors // .detail // .'
            exit 1
          fi
          echo "$RESPONSE" | jq -r '.configuration | to_entries[] | "\(.key)=\(.value)"' >> $GITHUB_ENV
          
          docker compose -f environments/dev/compose.yml up -d


      - name: Validate Deployment
        run: |
          echo "Validating deployment..."
          IMAGE_TAG=$(git rev-parse --short HEAD)
          
          export REGISTRY_URL=registry.local.test
          export IMAGE_TAG
          
          RESPONSE=$(curl -sf http://infra_configuration_manager:8080/contracts/deployment) || {
            echo "ERROR: Could not reach configuration manager service"
            exit 1
          }
          STATUS=$(echo "$RESPONSE" | jq -r '.status')
          if [ "$STATUS" != "validated" ]; then
            echo "Deployment contract validation failed"
            echo "$RESPONSE" | jq '.errors // .detail // .'
            exit 1
          fi
          echo "$RESPONSE" | jq -r '.configuration | to_entries[] | "\(.key)=\(.value)"' >> $GITHUB_ENV
          
          delivery validate dev


      - name: E2E Tests
        run: |
          echo "Running Playwright e2e tests..."
          
          cd packages/control-center-ui
          
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e
          
          cd -


      - name: Coverage Report
        if: always()
        run: |
          echo "Aggregating coverage reports..."
          
          mkdir -p coverage
          
          for pkg in packages/*/; do
            if [ -d "$pkg/tests" ]; then
              cd "$pkg"
              unset REGISTRY_USER REGISTRY_PASSWORD REGISTRY_ENDPOINT
              if [ "$(basename "$pkg")" != "workflow_runner" ]; then
                python -m pytest tests/ --cov=src --cov-report=xml --cov-report=term -m "not redis" 2>/dev/null || true
              else
                echo "Skipping workflow_runner coverage (pre-existing mcp v2 compatibility issue)"
              fi
              if [ -f coverage.xml ]; then
                cp coverage.xml ../coverage/$(basename "$pkg")-coverage.xml
              fi
              cd -
            fi
          done
          
          echo "Coverage reports available in coverage/"


      - name: Complete
        if: success()
        run: |
          echo "CI pipeline completed successfully"
          echo "Images tagged: $(git rev-parse --short HEAD)"
          echo "Dev stack deployed and e2e tests passed"
