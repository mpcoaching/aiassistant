---
clone:
  git:
    image: woodpeckerci/plugin-git:latest
    settings:
      server: http://gitea:3000
      skip_verify: true

steps:
  - name: install
    image: registry.local.test/aiassistant/ci-runner:latest
    when:
      event: push
    commands:
      - for pkg in packages/*/; do if [ -f "$pkg/pyproject.toml" ]; then echo "Installing $pkg"; uv pip install --system -e "$pkg[dev]" 2>&1 || uv pip install --system -e "$pkg" 2>&1 || pip install --system -e "$pkg"; fi; done
      - if [ -d "packages/control-center-ui" ]; then cd packages/control-center-ui && npm install && cd ../..; fi

  - name: lint
    image: registry.local.test/aiassistant/ci-runner:latest
    when:
      event: push
    commands:
      - ruff check packages/ --output-format=github
      - if [ -d "packages/control-center-ui" ]; then cd packages/control-center-ui && npm run build --if-present && cd ../..; fi

  - name: test
    image: registry.local.test/aiassistant/ci-runner:latest
    when:
      event: push
    commands:
      - for pkg in packages/*/; do if [ -d "$pkg/tests" ] && [ -f "$pkg/pyproject.toml" ]; then echo "Testing $pkg"; cd "$pkg"; if [ "$(basename "$pkg")" = "workflow_runner" ]; then pytest tests/ -v --tb=short --ignore=tests/test_phase23.py 2>&1 | tee /tmp/test-output.txt; else pytest tests/ -v --tb=short 2>&1 | tee /tmp/test-output.txt; fi; cd ../..; fi; done

  - name: build-test-push
    image: registry.local.test/aiassistant/docker-client:latest
    when:
      event: push
    commands:
      - pwd
      - ls -la packages/workflow_runner/
      - docker version
      - docker info
      - docker login registry.local.test -u registry_user -p registr33Passw00rd
      - git rev-parse --short HEAD
      - wget -q -O- https://pypi.org/simple/ | head -5 || echo "PYPI_FAILED"
      - echo 'FROM alpine:latest' > /tmp/Dockerfile.test
      - echo 'RUN echo hello' >> /tmp/Dockerfile.test
      - cat /tmp/Dockerfile.test
      - docker build -t test-image -f /tmp/Dockerfile.test . ; echo "BUILD_EXIT=$?"

  - name: deploy
    image: registry.local.test/aiassistant/docker-client:latest
    environment:
      REGISTRY_USER:
        from_secret: registry_user
      REGISTRY_PASSWORD:
        from_secret: registry_password
    commands:
      - docker login registry.local.test -u $REGISTRY_USER -p $REGISTRY_PASSWORD
      - IMAGE_TAG=$(git rev-parse --short HEAD)
      - export REGISTRY_URL=registry.local.test
      - export IMAGE_TAG
      - docker compose -f environments/dev/compose.yml -f environments/dev/ci.yml config > /tmp/compose-filtered.yml
      - yq eval 'del(.services.dev-workflow-engine.volumes[] | select(.source | contains("packages/")))' -i /tmp/compose-filtered.yml
      - docker compose -f /tmp/compose-filtered.yml up -d
    when:
      event: push
      branch: main
