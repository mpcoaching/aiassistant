---
clone:
  git:
    image: woodpeckerci/plugin-git:latest
    settings:
      server: http://gitea:3000
      skip_verify: true
      submodules: true

# Pipeline-level artifacts (Woodpecker collects these from every step's
# workspace). Declaring them here clears the "Additional property artifacts is
# not allowed" lint that a step-level `artifacts:` key produced.
artifacts:
  - /tmp/playwright-artifacts/**

steps:
  - name: install
    image: registry.local.test/aiassistant/ci-runner:latest
    when:
      event: [push, manual]
    commands:
      - for pkg in packages/*/; do if [ -f "$pkg/pyproject.toml" ]; then echo "Installing $pkg"; uv pip install --system -e "$pkg[dev]" 2>&1 || uv pip install --system -e "$pkg" 2>&1 || pip install --system -e "$pkg"; fi; done
      - if [ -d "packages/control-center-ui" ]; then cd packages/control-center-ui && npm install && cd ../..; fi

  - name: validate-contracts
    image: registry.local.test/aiassistant/ci-runner:latest
    when:
      event: [push, manual]
    environment:
      REGISTRY_USER:
        from_secret: registry_user
      REGISTRY_PASSWORD:
        from_secret: registry_password
      AGENT_DEV_DB_USER: aiassistant_user
      AGENT_DEV_DB_PASSWORD: secureDevDbAssistPass
      AGENT_DEV_DB_NAME: aiassistant
      LANGGRAPH_DEV_DB_USER: langgraph_dev_user
      LANGGRAPH_DEV_DB_PASSWORD: dev_langgraph_password
      LANGGRAPH_DEV_DB_NAME: langgraph_dev
      PYTHONPATH: /woodpecker/src/gitea.local.test/ai/aiassistant/packages/configuration/src
    commands:
      - pip install --break-system-packages -e packages/configuration[dev] 2>&1 || pip install --break-system-packages -e packages/configuration 2>&1
      - bash scripts/validate-deployment-contract.sh

  - name: lint
    image: registry.local.test/aiassistant/ci-runner:latest
    when:
      event: [push, manual]
    commands:
      - ruff check packages/ --output-format=github
      - if [ -d "packages/control-center-ui" ]; then cd packages/control-center-ui && npm run build --if-present && cd ../..; fi

  - name: test
    image: registry.local.test/aiassistant/ci-runner:latest
    when:
      event: [push, manual]
    commands:
      - for pkg in packages/*/; do if [ -d "$pkg/tests" ] && [ -f "$pkg/pyproject.toml" ]; then echo "Testing $pkg"; cd "$pkg"; if [ "$(basename "$pkg")" = "workflow_runner" ]; then pytest tests/test_platform_integration.py tests/test_e2e.py tests/test_increment17_integration.py tests/test_increment18_integration.py tests/test_increment19_integration.py -v --tb=short 2>&1 | tee /tmp/test-output.txt; else pytest tests/ -v --tb=short 2>&1 | tee /tmp/test-output.txt; fi; cd ../..; fi; done


  - name: build
    image: registry.local.test/aiassistant/docker-client:latest
    when:
      event: [push, manual]
    environment:
      REGISTRY_USER:
        from_secret: registry_user
      REGISTRY_PASSWORD:
        from_secret: registry_password
    commands:
      - git config --global --add safe.directory /woodpecker/src/gitea.local.test/ai/aiassistant
      - test -n "$REGISTRY_USER" && echo "USER_SET=yes" || echo "USER_SET=no"
      - test -n "$REGISTRY_PASSWORD" && echo "PASS_SET=yes" || echo "PASS_SET=no"
      - docker login registry.local.test -u $REGISTRY_USER -p $REGISTRY_PASSWORD
      - IMAGE_TAG=$(git rev-parse --short HEAD)
      - echo "IMAGE_TAG=$IMAGE_TAG"
      - "docker build -t registry.local.test/aiassistant/workflow_runner:$IMAGE_TAG -f packages/workflow_runner/Dockerfile ."
      - "docker tag registry.local.test/aiassistant/workflow_runner:$IMAGE_TAG registry.local.test/aiassistant/workflow_runner:latest"
      - "docker build -t registry.local.test/aiassistant/langgraph:$IMAGE_TAG -f packages/langgraph/Dockerfile ."
      - "docker tag registry.local.test/aiassistant/langgraph:$IMAGE_TAG registry.local.test/aiassistant/langgraph:latest"
      - "docker build -t registry.local.test/aiassistant/control-center-ui:$IMAGE_TAG -f packages/control-center-ui/Dockerfile packages/control-center-ui"
      - "docker tag registry.local.test/aiassistant/control-center-ui:$IMAGE_TAG registry.local.test/aiassistant/control-center-ui:latest"
      - "docker build -t registry.local.test/aiassistant/ci-runner:$IMAGE_TAG -f infrastructure/images/ci-runner/Dockerfile infrastructure/images/ci-runner"
      - "docker tag registry.local.test/aiassistant/ci-runner:$IMAGE_TAG registry.local.test/aiassistant/ci-runner:latest"

  # Paperclip is a vendored third-party submodule and is NOT part of the dev
  # deployment (environments/dev/compose.yml does not reference it). Its build
  # is currently broken upstream: the submodule Dockerfile installs Debian
  # trixie's rustc 1.85.1, but its icu_* crates require rustc >= 1.88, so
  # `cargo build` fails. These steps are marked failure:ignore so the
  # pre-existing vendored breakage is reported but does not block the
  # application pipeline. Remove this once the submodule pins a newer
  # toolchain.
  - name: build-paperclip
    image: registry.local.test/aiassistant/docker-client:latest
    failure: ignore
    when:
      event: [push, manual]
      path: ["operational/paperclip/**", ".woodpecker.yml"]
    environment:
      REGISTRY_USER:
        from_secret: registry_user
      REGISTRY_PASSWORD:
        from_secret: registry_password
    commands:
      - git config --global --add safe.directory /woodpecker/src/gitea.local.test/ai/aiassistant
      - docker login registry.local.test -u $REGISTRY_USER -p $REGISTRY_PASSWORD
      - IMAGE_TAG=$(git rev-parse --short HEAD)
      - echo "IMAGE_TAG=$IMAGE_TAG"
      - "docker build -t registry.local.test/aiassistant/paperclip:$IMAGE_TAG -f operational/paperclip/Dockerfile operational/paperclip"
      - "docker tag registry.local.test/aiassistant/paperclip:$IMAGE_TAG registry.local.test/aiassistant/paperclip:latest"

  - name: test-paperclip
    image: registry.local.test/aiassistant/paperclip:latest
    failure: ignore
    when:
      event: [push, manual]
      path: ["operational/paperclip/**"]
    commands:
      - curl -f http://localhost:3100/api/health || (echo "Paperclip health check failed" && exit 1)

  - name: test-paperclip-integration
    image: registry.local.test/aiassistant/docker-client:latest
    failure: ignore
    when:
      event: [push, manual]
      path: ["packages/organisation_paperclip/**", "operational/paperclip/**", ".woodpecker.yml"]
    commands:
      - git config --global --add safe.directory /woodpecker/src/gitea.local.test/ai/aiassistant
      - docker run -d --name paperclip-integration -p 3100:3100 registry.local.test/aiassistant/paperclip:latest
      - for i in $(seq 1 30); do curl -fs http://localhost:3100/api/health && break || sleep 2; done
      - cd packages/organisation_paperclip && pip install --break-system-packages -e . 2>&1 || pip install --break-system-packages -e .
      - PAPERCLIP_URL=http://localhost:3100 pytest tests/test_integration.py -v
      - docker stop paperclip-integration || true

  - name: test-image
    image: registry.local.test/aiassistant/docker-client:latest
    when:
      event: [push, manual]
    commands:
      - git config --global --add safe.directory /woodpecker/src/gitea.local.test/ai/aiassistant
      - IMAGE_TAG=$(git rev-parse --short HEAD)
      - "bash scripts/test-image.sh registry.local.test/aiassistant/workflow_runner:$IMAGE_TAG"
      - "bash scripts/test-image.sh registry.local.test/aiassistant/langgraph:$IMAGE_TAG"
      - "bash scripts/test-image.sh registry.local.test/aiassistant/control-center-ui:$IMAGE_TAG"

  - name: build-ci-runner
    image: registry.local.test/aiassistant/docker-client:latest
    when:
      event: [push, manual]
      path: [infrastructure/images/ci-runner/**]
    environment:
      REGISTRY_USER:
        from_secret: registry_user
      REGISTRY_PASSWORD:
        from_secret: registry_password
    commands:
      - git config --global --add safe.directory /woodpecker/src/gitea.local.test/ai/aiassistant
      - docker login registry.local.test -u $REGISTRY_USER -p $REGISTRY_PASSWORD
      - IMAGE_TAG=$(git rev-parse --short HEAD)
      - echo "IMAGE_TAG=$IMAGE_TAG"
      - docker build --no-cache -t aiassistant-ci:test -f infrastructure/images/ci-runner/Dockerfile infrastructure/images/ci-runner
      - docker tag aiassistant-ci:test aiassistant-ci:latest
      - docker tag aiassistant-ci:test registry.local.test/aiassistant/ci-runner:latest
      - docker tag aiassistant-ci:test registry.local.test/aiassistant/ci-runner:$IMAGE_TAG
      - docker push registry.local.test/aiassistant/ci-runner:latest
      - docker push registry.local.test/aiassistant/ci-runner:$IMAGE_TAG

  - name: test-ci-runner
    image: aiassistant-ci:test
    when:
      event: [push, manual]
      path: [infrastructure/images/ci-runner/**]
    commands:
      - python --version
      - pip --version
      - uv --version
      - jq --version
      - yq --version
      - node --version
      - npm --version
      - ruff --version
      - pytest --version

  - name: push
    image: registry.local.test/aiassistant/docker-client:latest
    when:
      event: [push, manual]
    environment:
      REGISTRY_USER:
        from_secret: registry_user
      REGISTRY_PASSWORD:
        from_secret: registry_password
    commands:
      - git config --global --add safe.directory /woodpecker/src/gitea.local.test/ai/aiassistant
      - docker login registry.local.test -u $REGISTRY_USER -p $REGISTRY_PASSWORD
      - IMAGE_TAG=$(git rev-parse --short HEAD)
      - "docker push registry.local.test/aiassistant/workflow_runner:$IMAGE_TAG"
      - "docker push registry.local.test/aiassistant/langgraph:$IMAGE_TAG"
      - "docker push registry.local.test/aiassistant/control-center-ui:$IMAGE_TAG"
      - "docker push registry.local.test/aiassistant/ci-runner:$IMAGE_TAG"
      # build-paperclip is path-filtered, so on commits that do not touch
      # operational/paperclip/** the image is absent and an unconditional push
      # would fail the whole pipeline. Push it only when it was actually built.
      - |
        if docker image inspect "registry.local.test/aiassistant/paperclip:$IMAGE_TAG" >/dev/null 2>&1; then
          docker push "registry.local.test/aiassistant/paperclip:$IMAGE_TAG"
          docker tag "registry.local.test/aiassistant/paperclip:$IMAGE_TAG" registry.local.test/aiassistant/paperclip:latest
          docker push registry.local.test/aiassistant/paperclip:latest
        else
          echo "paperclip image not built in this run; skipping paperclip push"
        fi
      - "docker tag registry.local.test/aiassistant/workflow_runner:$IMAGE_TAG registry.local.test/aiassistant/workflow_runner:latest"
      - "docker push registry.local.test/aiassistant/workflow_runner:latest"
      - "docker tag registry.local.test/aiassistant/langgraph:$IMAGE_TAG registry.local.test/aiassistant/langgraph:latest"
      - "docker push registry.local.test/aiassistant/langgraph:latest"
      - "docker tag registry.local.test/aiassistant/control-center-ui:$IMAGE_TAG registry.local.test/aiassistant/control-center-ui:latest"
      - "docker push registry.local.test/aiassistant/control-center-ui:latest"
      - "docker tag registry.local.test/aiassistant/ci-runner:$IMAGE_TAG registry.local.test/aiassistant/ci-runner:latest"
      - "docker push registry.local.test/aiassistant/ci-runner:latest"

  - name: test-e2e
    image: registry.local.test/aiassistant/ci-runner:latest
    when:
      event: [push, manual]
    environment:
      REGISTRY_URL: registry.local.test
      E2E_BASE_URL: http://dev.local.test:5173
      REGISTRY_USER:
        from_secret: registry_user
      REGISTRY_PASSWORD:
        from_secret: registry_password
      AGENT_DEV_DB_USER: aiassistant_user
      AGENT_DEV_DB_PASSWORD: secureDevDbAssistPass
      AGENT_DEV_DB_NAME: aiassistant
      LANGGRAPH_DEV_DB_USER: langgraph_dev_user
      LANGGRAPH_DEV_DB_PASSWORD: dev_langgraph_password
      LANGGRAPH_DEV_DB_NAME: langgraph_dev
    commands:
      - git config --global --add safe.directory /woodpecker/src/gitea.local.test/ai/aiassistant
      - export IMAGE_TAG=$(git rev-parse --short HEAD)
      - echo "IMAGE_TAG=$IMAGE_TAG"
      - docker login registry.local.test -u $REGISTRY_USER -p $REGISTRY_PASSWORD
      # Only the dev tier is managed here. infrastructure/ and platform/ are the
      # long-lived CI host services (Gitea, registry, Woodpecker itself); a
      # `down -v` against them would destroy the running pipeline's own
      # registry and control plane.
      - cleanup() {
          docker compose -f environments/dev/compose.yml -f environments/dev/ci.yml down -v || true;
        }
      - trap cleanup EXIT
      - docker compose -f environments/dev/compose.yml -f environments/dev/ci.yml up -d
      - |
        echo "Waiting for backend health..."
        ready=0
        for i in $(seq 1 60); do
          if curl -fsS http://dev.local.test:8001/health >/dev/null 2>&1; then echo "Backend ready"; ready=1; break; fi
          sleep 5
        done
        if [ "$ready" -ne 1 ]; then echo "Backend did not become ready in time"; docker compose -f environments/dev/compose.yml logs; exit 1; fi
      - |
        echo "Waiting for UI..."
        ready=0
        for i in $(seq 1 60); do
          if curl -fsS http://dev.local.test:5173/ >/dev/null 2>&1; then echo "UI ready"; ready=1; break; fi
          sleep 5
        done
        if [ "$ready" -ne 1 ]; then echo "UI did not become ready in time"; docker compose -f environments/dev/compose.yml logs; exit 1; fi
      # Playwright must run from packages/control-center-ui: that is where
      # playwright.config.ts, the @playwright/test dependency and the specs
      # live. Running `npx playwright` from the repo root finds no config, so
      # E2E_BASE_URL is ignored and relative page.goto("/") has no base URL.
      - cd packages/control-center-ui && npm install && npx playwright install --with-deps chromium
      - cd packages/control-center-ui && npx playwright test tests/e2e/critical-path.spec.ts --reporter=list,junit
      - mkdir -p /tmp/playwright-artifacts
      - cp packages/control-center-ui/playwright-results.xml /tmp/playwright-artifacts/ || true
      - if [ -d packages/control-center-ui/playwright-report ]; then cp -r packages/control-center-ui/playwright-report /tmp/playwright-artifacts/; fi

  - name: deploy
    image: registry.local.test/aiassistant/docker-client:latest
    environment:
      REGISTRY_USER:
        from_secret: registry_user
      REGISTRY_PASSWORD:
        from_secret: registry_password
      AGENT_DEV_DB_USER: aiassistant_user
      AGENT_DEV_DB_PASSWORD: secureDevDbAssistPass
      AGENT_DEV_DB_NAME: aiassistant
      LANGGRAPH_DEV_DB_USER: langgraph_dev_user
      LANGGRAPH_DEV_DB_PASSWORD: dev_langgraph_password
      LANGGRAPH_DEV_DB_NAME: langgraph_dev
    commands:
      - git config --global --add safe.directory /woodpecker/src/gitea.local.test/ai/aiassistant
      - docker login registry.local.test -u $REGISTRY_USER -p $REGISTRY_PASSWORD
      - IMAGE_TAG=$(git rev-parse --short HEAD)
      - export REGISTRY_URL=registry.local.test
      - export IMAGE_TAG
      - export AGENT_DEV_DB_USER
      - export AGENT_DEV_DB_PASSWORD
      - export AGENT_DEV_DB_NAME
      - export LANGGRAPH_DEV_DB_USER
      - export LANGGRAPH_DEV_DB_PASSWORD
      - export LANGGRAPH_DEV_DB_NAME
      - docker compose -f environments/dev/compose.yml -f environments/dev/ci.yml config > /tmp/compose-filtered.yml
      - yq eval 'del(.services.dev-workflow-engine.volumes[] | select(.source | contains("packages/")))' -i /tmp/compose-filtered.yml
      - docker compose -f /tmp/compose-filtered.yml up -d
    when:
      event: [push, manual]
      branch: main
# trigger deploy
