[project]
name = "aiassistant-configuration"
version = "0.1.0"
description = "Configuration Manager service — resolves, caches, validates, and delivers runtime contracts to capabilities"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "redis>=5.2.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6.0",
    "httpx>=0.28.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
markers = [
    "redis: marks tests as requiring a running Redis instance",
]