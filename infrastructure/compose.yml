# =============================================================================
# Infrastructure stack — control plane + private registry.
# Owns the four networks (single owner). Start FIRST:
#   docker compose -f infrastructure/compose.yml up -d
# Platform / dev / live composes reference these networks as external.
# =============================================================================
name: infrastructure

services:
  # ----- Nginx: the ONLY sanctioned bridge for human/client traffic -----
  # Attaches to infra + platform; proxies control-plane UIs and the two
  # per-environment platform gateways. Never attaches to dev/live networks.
  nginx-proxy:
    image: nginx:alpine
    container_name: infra_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    networks:
      - infrastructure-network
      - platform-network
    volumes:
      - ./configs/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./configs/nginx/certs/local.test.crt:/etc/nginx/certs/local.test.crt:ro
      - ./configs/nginx/certs/local.test.key:/etc/nginx/certs/local.test.key:ro
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----- DNS: CoreDNS — resolves *.local.test for Docker network containers AND external clients -----
  # Exposed on host port 53 so Fedora/laptop can query it for *.local.test resolution.
  # Forwards non-*.local.test queries to public DNS (1.1.1.1).
  core_dns:
    image: coredns/coredns:1.11.1
    container_name: infra_dns
    command: -conf /etc/coredns/Corefile
    ports:
      - "53:53/tcp"
      - "53:53/udp"
    volumes:
      - ./configs/coredns/Corefile:/etc/coredns/Corefile:ro
    networks:
      - infrastructure-network
    restart: unless-stopped

  # ----- CI: Gitea (git source of truth) -----
  gitea:
    image: gitea/gitea:1.27
    container_name: infra_gitea
    environment:
      - GITEA__database__DB_TYPE=sqlite3
      - GITEA__server__ROOT_URL=https://gitea.local.test/
      - GITEA__server__SSH_DOMAIN=gitea.local.test
      - GITEA__service__DISABLE_REGISTRATION=false
      - GITEA__security__ALLOWED_HOST_LIST=woodpecker.local.test
      - GITEA__security__SKIP_VERIFY=true
    restart: unless-stopped
    extra_hosts:
      - "woodpecker.local.test:192.168.1.238"
    networks:
      infrastructure-network:
        aliases:
          - gitea
      ai_net:
        aliases:
          - gitea
    volumes:
      - ./configs/nginx/local.test.crt:/tmp/local.test.crt:ro
      - gitea_data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    command: sh -c 'cp /tmp/local.test.crt /usr/local/share/ca-certificates/local.test.crt && update-ca-certificates && exec /usr/bin/s6-svscan /etc/s6'
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  gitea-runner:
    image: gitea/act_runner:latest
    container_name: infra_gitea_runner

    environment:
      GITEA_INSTANCE_URL: http://gitea:3000
      GITEA_RUNNER_REGISTRATION_TOKEN: ${GITEA_RUNNER_REGISTRATION_TOKEN}
      GITEA_RUNNER_NAME: ${GITEA_RUNNER_NAME}
      GITEA_RUNNER_LABELS: ${GITEA_RUNNER_LABELS}
      CONFIG: /data/config.yml
      CONFIG_TEMPLATE: /gitea-runner/config.template.yaml
      GITEA_RUNNER_CONTAINER_NETWORK: infrastructure-network
    ports:
      - "8088:8088"

    depends_on:
      gitea:
        condition: service_healthy

    restart: unless-stopped

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./configs/gitea-runner:/gitea-runner:ro
      - ./configs/gitea-runner/data:/data
      - ./configs/gitea-runner/cache:/cache
      - ./configs/gitea-runner/entrypoint.sh:/entrypoint.sh:ro

    entrypoint: ["/bin/bash", "/entrypoint.sh"]

    networks:
      - infrastructure-network
      - platform-network

  # ----- Redis: shared cache for Configuration Manager -----
  redis:
    image: redis:7-alpine
    container_name: infra_redis
    networks:
      - platform-network
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ----- Configuration Manager: resolves, validates, caches contracts -----
  configuration-manager:
    build:
      context: ../packages/configuration
      dockerfile: Dockerfile
    image: platform/configuration-manager:latest
    container_name: infra_configuration_manager
    environment:
      REDIS_URL: redis://redis:6379
      CONTRACTS_PATH: /etc/platform/contracts
      SOURCES_CONFIG_PATH: /etc/platform/sources.yaml
      REGISTRY_USER: ${REGISTRY_USER}
      REGISTRY_PASSWORD: ${REGISTRY_PASSWORD}
    volumes:
      - ../contracts:/etc/platform/contracts
      - ../.env:/etc/platform/.env:ro
      - registry_data:/data
    networks:
      - platform-network
      - infrastructure-network
    extra_hosts:
      - "registry.local.test:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ----- Private registry (immutable <git-sha> images) -----
  # Serves plain HTTP internally; TLS is terminated by nginx-proxy for
  # registry.local.test (local.test.crt covers *.local.test). Basic auth at
  # the registry layer. Host-context pulls (TeamCity agent uses host daemon)
  # hit host:443 -> nginx -> registry:5000.
  registry:
    image: registry:2
    container_name: infra_registry
    restart: unless-stopped
    networks:
      - infrastructure-network
    environment:
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: "Registry Realm"
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /data
      REGISTRY_USER: ${REGISTRY_USER}
      REGISTRY_PASSWORD: ${REGISTRY_PASSWORD}
    volumes:
      - registry_data:/data
      - ./configs/registry/htpasswd:/auth/htpasswd:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider --tries=1 http://localhost:5000/v2/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ----- Woodpecker CI -----
  # Parallel CI system. Agent mounts host Docker socket for native builds.
  # Repository must be marked Trusted in Woodpecker UI for socket access.
  woodpecker-server:
    image: woodpeckerci/woodpecker-server:v3
    container_name: infra_woodpecker_server
    ports:
      - "8000:8000"
      - "9000:9000"
    volumes:
      - woodpecker-server-data:/var/lib/woodpecker
    environment:
      - WOODPECKER_OPEN=true
      - WOODPECKER_HOST=https://woodpecker.local.test
      - WOODPECKER_GITEA=true
      - WOODPECKER_GITEA_URL=https://gitea.local.test
      - WOODPECKER_GITEA_CLIENT=${WOODPECKER_GITEA_CLIENT}
      - WOODPECKER_GITEA_SECRET=${WOODPECKER_GITEA_SECRET}
      - WOODPECKER_GITEA_SKIP_VERIFY=true
      - WOODPECKER_AGENT_SECRET=${WOODPECKER_AGENT_SECRET}
      - WOODPECKER_GRPC_SECRET=${WOODPECKER_GRPC_SECRET}
      - WOODPECKER_BACKEND_DOCKER_HOST=unix:///var/run/docker.sock
      - WOODPECKER_BACKEND_DOCKER_VOLUMES=/var/run/docker.sock:/var/run/docker.sock
    dns:
      - 192.168.1.238
    networks:
      - infrastructure-network
    restart: unless-stopped
    depends_on:
      - gitea

  woodpecker-agent:
    image: woodpeckerci/woodpecker-agent:v3.17.0
    container_name: infra_woodpecker_agent
    command: agent
    restart: unless-stopped
    depends_on:
      - woodpecker-server
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - woodpecker-agent-config:/etc/woodpecker
    environment:
      - WOODPECKER_SERVER=localhost:9000
      - WOODPECKER_AGENT_SECRET=${WOODPECKER_AGENT_SECRET}
      - WOODPECKER_LOG_LEVEL=debug
      - WOODPECKER_BACKEND_DOCKER_HOST=unix:///var/run/docker.sock
    network_mode: host
    networks: []

networks:
  # Single owner of all four networks. Explicit names => globally consistent
  # across the four Compose projects (no project-prefix surprises).
  infrastructure-network:
    name: infrastructure-network
    driver: bridge
  platform-network:
    name: platform-network
    driver: bridge
  dev-network:
    name: dev-network
    driver: bridge
  live-network:
    name: live-network
    driver: bridge
  ai_net:
    external: true
    name: ai_net

volumes:
  gitea_data:
  registry_data:
  redis_data:
  configuration_data:
  woodpecker-server-data:
  woodpecker-agent-config:
