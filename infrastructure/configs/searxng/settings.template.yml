# SearXNG instance settings — platform stack (private metasearch).
#
# Only values that DIFFER from SearXNG's shipped defaults are set here.
# `use_default_settings: true` keeps everything else from the image's
# searx/settings.yml — but its default engine list is NOT conservative: the
# image enables 121 engines, many of which need API keys this platform does not
# have (so they fail on every query) or are Tor-only. The `engines:` block at
# the bottom therefore pins an explicit allowlist of 8 and disables the other
# 113, so the enabled surface is deliberate rather than inherited.
#
# This file is a TEMPLATE: the double-underscore SECRET/BASE_URL placeholders
# below are resolved from the platform environment (../.env) by the sibling
# entrypoint.sh before SearXNG starts. Nothing here is read from Git verbatim.
use_default_settings: true

general:
  instance_name: "AiAssistant Search"

server:
  # ---- Private instance, deliberately not a public SearXNG service ----
  # Reachable only from the platform Docker network (n8n -> searxng:8080) and
  # through nginx on searxng.local.test. `limiter` (bot detection + link
  # tokens) stays OFF: it exists to shield *public* instances, and it would
  # reject server-to-server JSON calls from n8n. `public_instance: false` keeps
  # the donation/instance-info chrome off the results page.
  limiter: false
  public_instance: false
  bind_address: "0.0.0.0"
  port: 8080
  # Public URL, so inbound links in the rendered HTML match the nginx
  # server_name. Must equal SEARXNG_BASE_URL in ../.env.
  base_url: "__SEARXNG_BASE_URL__"
  # No image proxy: result thumbnails are served straight from their origin
  # hosts, so SearXNG makes no outbound requests to fetch them.
  image_proxy: false
  # Signs this instance's cookies and limiter tokens. From SEARXNG_SECRET.
  secret_key: "__SEARXNG_SECRET__"

search:
  # html -> browser / admin use through nginx.
  # json -> the machine API the n8n Search Utility calls over the Docker
  #         network. SearXNG ships `formats: [html]` only, so json must be
  #         listed explicitly or /search?format=json is denied.
  # Nothing else is exposed (no csv, no rss).
  formats:
    - html
    - json
  safe_search: 0
  # No autocomplete backend: it is a browser-only convenience and would add
  # per-keystroke outbound queries for an instance that is primarily an API.
  autocomplete: ""

engines:
  # ---- Explicit allowlist: 8 engines enabled, the other 113 disabled ----
  # SearXNG's shipped defaults enable 121 engines. That is far too broad for a
  # private instance: it includes Tor-only engines (ahmia, torch — they fail to
  # register without Tor and log an error on every start), engines that require
  # API keys this platform has no credentials for (they fail on every query),
  # and a large tail of image/video/music verticals irrelevant to the search
  # path. Enabling all of them also means every query fans out to 100+ upstreams,
  # which is slow and invites rate-limiting.
  #
  # The list below is the whole enabled surface. Keep it small, and add an engine
  # here only together with the credentials it needs.
  #
  # Enabled (no API key required):
  #   duckduckgo, brave, startpage, mojeek  — general web search
  #   google cse, google news               — Google's Programmable Search
  #                                          element, which needs no key here
  #   wikipedia, wikidata                   — entity/reference lookups
  #
  # Everything the image enabled by default and that is NOT in that allowlist.
  # `disabled: true` is the default state for the other ~230 engine definitions
  # the image ships, so those need no entry here.
  - name: 1x
    disabled: true
  - name: 500px
    disabled: true
  - name: Torznab EZTV
    disabled: true
  - name: ahmia
    disabled: true
  - name: arch linux wiki
    disabled: true
