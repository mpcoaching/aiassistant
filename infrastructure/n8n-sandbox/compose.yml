# =============================================================================
# n8n AI Assistant Sandbox — isolated n8n instance for development/testing.
# Runs on port 5679 with its own database and volume.
# Shares platform services (postgres, redis, clickhouse, etc.) via platform-network.
#
# Prerequisites: platform stack running (make platform-up)
#
# Start:
#   docker compose -f environments/n8n-sandbox/compose.yml --env-file .env up -d
#
# Stop:
#   docker compose -f environments/n8n-sandbox/compose.yml --env-file .env down
# =============================================================================
name: n8n-sandbox

services:
  n8n-sandbox:
    image: n8nio/n8n:latest@sha256:9c7871d5cc4fc2565bb905e4df5bf7d6a5a4bf2f4313fb99a2b3fa380f331d7c
    container_name: n8n-sandbox
    restart: unless-stopped
    ports:
      - "5679:5678"
    env_file:
      - ../../.env
    env_file:
      - ../../.env
      - .env.sandbox
    environment:
      - N8N_HOST=n8n-sandbox.local.test
      - N8N_PORT=5678
      - DB_TYPE=${N8N_DB_TYPE:?N8N_DB_TYPE unset}
      - DB_POSTGRESDB_HOST=${N8N_DB_HOST:?N8N_DB_HOST unset}
      - DB_POSTGRESDB_PORT=${N8N_DB_PORT:?N8N_DB_PORT unset}
      - DB_POSTGRESDB_DATABASE=n8n_sandbox
      - DB_POSTGRESDB_USER=${N8N_DB_USER:?N8N_DB_USER unset}
      - DB_POSTGRESDB_PASSWORD=${N8N_DB_PASSWORD:?N8N_DB_PASSWORD unset}
      - N8N_WEBHOOK_URL=http://n8n-sandbox.local.test
      - N8N_EDITOR_BASE_URL=http://n8n-sandbox.local.test
      - N8N_SECURE_COOKIE=false
      - N8N_PROXY_HOPS=1
      - N8N_CUSTOM_EXTENSIONS=/home/node/.n8n/custom
      - N8N_OTEL_ENABLED=${N8N_OTEL_ENABLED}
      - N8N_OTEL_SERVICE_NAME=n8n-sandbox
      - N8N_OTEL_EXPORTER_OTLP_ENDPOINT=${N8N_OTEL_EXPORTER_OTLP_ENDPOINT}
      - N8N_UNVERIFIED_PACKAGES_ENABLED=${N8N_UNVERIFIED_PACKAGES_ENABLED}
      - N8N_RUNNERS_MODE=${N8N_RUNNERS_MODE}
      - N8N_RUNNERS_TASK_TIMEOUT=${N8N_RUNNERS_TASK_TIMEOUT}
      - N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES=${N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES}
      - N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES=${N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES}
      - N8N_DIAGNOSTICS_ENABLED=${N8N_DIAGNOSTICS_ENABLED}
      - N8N_PERSONALIZATION_ENABLED=${N8N_PERSONALIZATION_ENABLED}
      - N8N_VERSION_NOTIFICATIONS_ENABLED=${N8N_VERSION_NOTIFICATIONS_ENABLED}
      - LANGCHAIN_TRACING_V2=${N8N_LANGCHAIN_TRACING_V2}
      - LANGCHAIN_API_KEY=${N8N_LANGCHAIN_API_KEY}
      - LANGCHAIN_ENDPOINT=${N8N_LANGCHAIN_ENDPOINT}
      - LANGCHAIN_PROJECT=${N8N_LANGCHAIN_PROJECT}
      - NODE_EXTRA_CA_CERTS=/etc/ssl/certs/mkcert-rootCA.pem
      # n8n Assistant configuration
      - N8N_INSTANCE_AI_SANDBOX_ENABLED=true
      - N8N_INSTANCE_AI_SANDBOX_PROVIDER=n8n-sandbox
      - N8N_SANDBOX_SERVICE_URL=http://sandbox-api:8080
      - N8N_SANDBOX_SERVICE_API_KEY=${N8N_SANDBOX_SERVICE_API_KEY}
      - N8N_INSTANCE_AI_SEARXNG_URL=${N8N_INSTANCE_AI_SEARXNG_URL}
      - N8N_INSTANCE_AI_MODEL_API_KEY=${N8N_INSTANCE_AI_MODEL_API_KEY}
      - N8N_INSTANCE_AI_MODEL=${N8N_INSTANCE_AI_MODEL}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    stop_grace_period: 60s
    networks:
      - platform-network
      - infrastructure-network
    volumes:
      - n8n_sandbox_data:/home/node/.n8n
      - ../../custom-nodes:/home/node/.n8n/custom
      - ../../packages/configuration/rootCA.pem:/etc/ssl/certs/mkcert-rootCA.pem:ro

networks:
  platform-network:
    name: platform-network
    external: true
  infrastructure-network:
    name: infrastructure-network
    external: true

volumes:
  n8n_sandbox_data:
