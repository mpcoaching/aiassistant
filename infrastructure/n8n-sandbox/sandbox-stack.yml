# =============================================================================
# n8n Sandbox Stack for n8n Assistant
# Provides sandbox-api, sandbox-runner-1, sandbox-certs, and searxng
# Run alongside the main n8n-sandbox compose file
# =============================================================================
name: n8n-sandbox

services:
  # Generates mTLS certificates for sandbox-api and sandbox-runner-1
  # Runs once at startup, then exits
  sandbox-certs:
    image: n8nio/n8n-sandbox-service-api:1.4.0
    container_name: n8n-sandbox-certs
    command: ["generate-certs"]
    environment:
      - SANDBOX_CERTS_DIR=/certs
      - SANDBOX_CA_CERT_PATH=/certs/ca.pem
      - SANDBOX_API_CERT_PATH=/certs/api.pem
      - SANDBOX_API_KEY_PATH=/certs/api-key.pem
      - SANDBOX_RUNNER_CERT_PATH=/certs/runner.pem
      - SANDBOX_RUNNER_KEY_PATH=/certs/runner-key.pem
    volumes:
      - sandbox_certs:/certs
    networks:
      - infrastructure-network
    restart: "no"

  # Sandbox API - control plane that n8n talks to for code execution
  sandbox-api:
    image: n8nio/n8n-sandbox-service-api:1.4.0
    container_name: n8n-sandbox-api
    restart: unless-stopped
    environment:
      - SANDBOX_API_ADDR=:8080
      - SANDBOX_API_GRPC_ADDR=:8081
      - SANDBOX_API_KEYS=${SANDBOX_API_KEYS}
      - SANDBOX_API_RUNNER_REGISTRATION_TOKEN=${SANDBOX_API_RUNNER_REGISTRATION_TOKEN}
      - SANDBOX_API_RUNNER_API_KEY=${SANDBOX_API_RUNNER_API_KEY}
      - SANDBOX_CERTS_DIR=/certs
      - SANDBOX_CA_CERT_PATH=/certs/ca.pem
      - SANDBOX_API_CERT_PATH=/certs/api.pem
      - SANDBOX_API_KEY_PATH=/certs/api-key.pem
      - SANDBOX_RUNNER_CERT_PATH=/certs/runner.pem
      - SANDBOX_RUNNER_KEY_PATH=/certs/runner-key.pem
      - SANDBOX_RUNNER_DOCKER_SANDBOX_IMAGE=n8nio/n8n-sandbox-service-sandbox:1.4.0
    volumes:
      - sandbox_certs:/certs:ro
    networks:
      - infrastructure-network
    depends_on:
      sandbox-certs:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Sandbox Runner - privileged Docker-in-Docker container that runs sandboxes
  sandbox-runner-1:
    image: n8nio/n8n-sandbox-service-runner-dind:1.4.0
    container_name: n8n-sandbox-runner-1
    restart: unless-stopped
    privileged: true
    environment:
      - SANDBOX_RUNNER_API_GRPC_ADDR=sandbox-api:8081
      - SANDBOX_RUNNER_REGISTRATION_TOKEN=${SANDBOX_API_RUNNER_REGISTRATION_TOKEN}
      - SANDBOX_RUNNER_API_KEY=${SANDBOX_API_RUNNER_API_KEY}
      - SANDBOX_RUNNER_DOCKER_SANDBOX_IMAGE=n8nio/n8n-sandbox-service-sandbox:1.4.0
      - SANDBOX_CERTS_DIR=/certs
      - SANDBOX_CA_CERT_PATH=/certs/ca.pem
      - SANDBOX_RUNNER_CERT_PATH=/certs/runner.pem
      - SANDBOX_RUNNER_KEY_PATH=/certs/runner-key.pem
    volumes:
      - sandbox_certs:/certs:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - infrastructure-network
    depends_on:
      sandbox-api:
        condition: service_healthy

  # SearXNG - bundled web search for n8n Assistant
  searxng:
    image: searxng/searxng:2026.10.2-19ffbcd30
    container_name: n8n-sandbox-searxng
    restart: unless-stopped
    expose:
      - 8080
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET}
      - SEARXNG_BASE_URL=http://searxng:8080
    entrypoint: ["/etc/searxng/docker-entrypoint.sh"]
    volumes:
      - ./searxng-settings.yml:/etc/searxng/settings.yml:ro
    networks:
      - infrastructure-network

networks:
  infrastructure-network:
    name: infrastructure-network
    external: true
  platform-network:
    name: platform-network
    external: true

volumes:
  sandbox_certs: