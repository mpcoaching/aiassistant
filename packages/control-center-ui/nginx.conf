server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # proxy_pass must stay a literal. When it contains a variable, nginx
    # stops rewriting the request URI and forwards the location prefix only,
    # so /api/health reached the backend as "/" and 404'd. A literal also
    # lets Docker's embedded DNS resolve the service name at startup, so the
    # resolver directive is no longer needed.
    location /api/ {
        proxy_pass http://dev_workflow_engine:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
