[lint]
select = ["E", "W", "F", "B"]
ignore = [
  "I001", "S110", "BLE001", "DTZ005", "UP012",
  "ASYNC230", "PLW1510", "SIM117", "E501", "W292",
  "E402", "B904", "B905", "W293", "E741",
]

[lint.per-file-ignores]
"**/__init__.py" = ["F401"]
"**/tests/**" = ["S101", "S105", "S106", "S108"]

[format]
quote-style = "double"
